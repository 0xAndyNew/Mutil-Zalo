[package]
name = "mutil-zalo"
version.workspace = true
edition.workspace = true

[[bin]]
name = "Mutil-Zalo"
path = "src/main.rs"

[dependencies]
flate2 = "1.1"

[build-dependencies]
flate2 = "1.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Registry",
] }
