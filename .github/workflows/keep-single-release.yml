name: Keep Single Latest Release

on:
  release:
    types: [published]
  push:
    branches:
      - main
    paths:
      - ".github/workflows/keep-single-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prune-old-releases:
    runs-on: ubuntu-latest
    steps:
      - name: Keep only the latest GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          LATEST=$(gh api "repos/$REPO/releases/latest" --jq '.id')
          if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
            echo "No latest release found; skipping cleanup."
            exit 0
          fi
          echo "Keeping latest release id: $LATEST"
          IDS=$(gh api "repos/$REPO/releases?per_page=100" --jq ".[] | select(.id != $LATEST) | .id")
          for ID in $IDS; do
            TAG=$(gh api "repos/$REPO/releases/$ID" --jq '.tag_name // ""')
            echo "Deleting old release id=$ID tag=$TAG"
            gh api -X DELETE "repos/$REPO/releases/$ID"
            if [ -n "$TAG" ]; then
              gh api -X DELETE "repos/$REPO/git/refs/tags/$TAG" || true
            fi
          done
